name: Feature request
description: Propose a focused improvement.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior, including API or frontend changes.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Privacy and operating cost
      description: Note effects on retained data, upstream requests, and Steam API-key spend.
