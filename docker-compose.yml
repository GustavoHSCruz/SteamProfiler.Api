services:
  web:
    image: nginx:alpine
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-16200}:80"
    volumes:
      - ${FRONTEND_DIR:-../steamprofiler-front/site}:/usr/share/nginx/html:ro
      # The rebuilt front, which answers five addresses today and is
      # falled back out of by nginx when it is not here. Read only and
      # optional on purpose: a machine that has never built it serves
      # the old pages and nothing else changes.
      - ${FRONTEND_NEXT_DIR:-../steamprofiler-front/next/dist}:/usr/share/nginx/next:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Optional, operator-owned trusted proxy configuration. Empty by default.
      - ${NGINX_PROXY_TRUST_DIR:-./proxy-trust}:/etc/nginx/proxy-trust:ro
      - ${DATA_HOST_DIR:-app-data}:/srv:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 60s
      timeout: 5s
      retries: 3

  # A named volume may first be initialized through nginx's root-owned /srv.
  # Normalize ownership before the unprivileged application touches SQLite.
  init-data:
    build:
      context: .
    user: "0:0"
    command: ["chown", "-R", "10001:10001", "/app/data"]
    volumes:
      # Onde os bancos moram. O volume nomeado continua sendo o default, que é
      # o que um clone limpo quer; um servidor que já tinha os bancos numa pasta
      # aponta DATA_HOST_DIR para ela. Sem isso, recriar o container sobe a api em
      # cima de um volume vazio e ela responde como se não soubesse nada - o que
      # aconteceu em produção em 11/09/2026, com os contadores caindo para 1.
      - ${DATA_HOST_DIR:-app-data}:/app/data
    restart: "no"
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
    env_file:
      - .env
    environment:
      CACHE_TTL: "${CACHE_TTL:-900}"
      DATA_DIR: /app/data
      PORT: "8000"
    volumes:
      # Onde os bancos moram. O volume nomeado continua sendo o default, que é
      # o que um clone limpo quer; um servidor que já tinha os bancos numa pasta
      # aponta DATA_HOST_DIR para ela. Sem isso, recriar o container sobe a api em
      # cima de um volume vazio e ela responde como se não soubesse nada - o que
      # aconteceu em produção em 11/09/2026, com os contadores caindo para 1.
      - ${DATA_HOST_DIR:-app-data}:/app/data
    depends_on:
      init-data:
        condition: service_completed_successfully
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"
      interval: 60s
      timeout: 8s
      retries: 3
      start_period: 10s

  # ── A V2 ───────────────────────────────────────────────────────────
  # O Postgres da api em .NET (v2/). Sem porta publicada: só a api-v2 fala com
  # ele, pela rede do compose.
  #
  # A senha tem um padrão, e não `:?`, de propósito. Interpolação obrigatória
  # faz o compose inteiro deixar de parsear quando a variável falta, e aí
  # recriar a api da V1 num servidor que ainda não a tem no .env falharia por
  # causa de um banco que ela nem usa. O padrão serve para o clone que só quer
  # ver funcionar; em produção o deploy.sh se recusa a subir a V2 sem
  # POSTGRES_PASSWORD no .env.
  #
  # Os tetos são do tamanho do servidor, que divide 8 GB com muita coisa.
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: steamprofiler
      POSTGRES_DB: steamprofiler
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-steamprofiler}"
    command: ["postgres", "-c", "shared_buffers=96MB", "-c", "max_connections=30"]
    volumes:
      # O 18 mudou o layout: o volume vai na pasta de cima e os dados ficam em
      # /var/lib/postgresql/18/docker. Montar em .../data, como até o 17, faz o
      # container se recusar a subir.
      - pg-data:/var/lib/postgresql
    mem_limit: 384m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -U steamprofiler -d steamprofiler"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # A api em .NET. Ninguém depende dela: o `web` a alcança por nome resolvido a
  # cada pedido (ver o bloco /api/v2/ no nginx.conf), então ela pode cair,
  # reiniciar ou nem existir sem que o site perceba fora de /api/v2.
  #
  # Não aplica migration quando sobe. Isso é `docker compose run --rm api-v2
  # migrate`, que o deploy.sh roda antes de recriar este container.
  api-v2:
    build:
      context: ./v2
    environment:
      DB_HOST: db
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-steamprofiler}"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # A imagem não tem shell nem wget; quem pergunta é o próprio binário.
      test: ["CMD", "dotnet", "Service.API.dll", "probe"]
      interval: 60s
      timeout: 8s
      retries: 3
      start_period: 15s

  # Optional owner panel. It is intentionally absent from a normal `up` and
  # loopback-only by default. Prefer an SSH tunnel over a public port.
  admin:
    profiles: [admin]
    build:
      context: .
    command: ["python", "/app/admin/server.py"]
    ports:
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-16201}:8000"
    volumes:
      # Onde os bancos moram. O volume nomeado continua sendo o default, que é
      # o que um clone limpo quer; um servidor que já tinha os bancos numa pasta
      # aponta DATA_HOST_DIR para ela. Sem isso, recriar o container sobe a api em
      # cima de um volume vazio e ela responde como se não soubesse nada - o que
      # aconteceu em produção em 11/09/2026, com os contadores caindo para 1.
      - ${DATA_HOST_DIR:-app-data}:/app/data
      - ${FRONTEND_DIR:-../steamprofiler-front/site}:/app/site:ro
    env_file:
      - .env
    environment:
      ADMIN_ALLOW_IPS: "${ADMIN_ALLOW_IPS:-127.0.0.1,::1}"
      API_URL: http://api:8000
      DATA_DIR: /app/data
      OLLAMA_MODEL: "${OLLAMA_MODEL:-aya-expanse:8b}"
      OLLAMA_SLUG_MODEL: "${OLLAMA_SLUG_MODEL:-qwen3:8b}"
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      PUBLIC_SITE_URL: "${PUBLIC_SITE_URL:-http://127.0.0.1:16200}"
      PORT: "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"
      interval: 60s
      timeout: 8s
      retries: 3
      start_period: 10s

volumes:
  app-data:
  pg-data:
