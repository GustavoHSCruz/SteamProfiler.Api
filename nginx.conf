# Static assets are served from here; anything under /api/ is proxied to the
# service that holds the Steam key. The browser never gets the key.

# Cache policy keyed on content type: fonts never change, css/js aren't
# fingerprinted so they stay short-lived, and the HTML is only ever a shell.
# Behind a TLS terminator this container still speaks plain HTTP, so $scheme
# says "http" for a request the visitor made over HTTPS. Only the absolute URLs
# in the link preview care, but they are exactly the ones a scraper refuses to
# follow when the scheme is wrong. Falls back to $scheme when nothing is in
# front, which is the case today.
map $http_x_forwarded_proto $ext_scheme {
    default $scheme;
    https   https;
}

map $sent_http_content_type $sp_cache {
    # No default, and that is deliberate. add_header *adds*: with a default
    # here, every /api/ answer got a second Cache-Control on top of the one
    # api.py already set, and a payload the service says is good for ten
    # seconds arrived at the browser also claiming ten minutes. The API sets
    # its own; nothing here should have an opinion about it.
    default               "";
    "~*font/woff2"        "public, max-age=2592000, immutable";
    # Key art never changes for a given appid, and it is the heaviest thing the
    # site serves. Once the browser has it, it should stop asking.
    "~*image/jpeg"        "public, max-age=2592000, immutable";
    # No line for the icon set. It used to have one, "~*image/svg", back when
    # the only icon was favicon.svg. The set is five files in three types now,
    # and two of those types are types other things answer with: image/png is
    # also /api/og.png, which sets its own header, and a second Cache-Control
    # on top of that is the accident this map has no default in order to
    # avoid. So the icons carry their freshness in their own location block,
    # with `expires` rather than `add_header` - see the note there.
    # The shell and the code are not fingerprinted, so they have to be
    # revalidated rather than assumed fresh. They were held for two and ten
    # minutes, which meant every deploy had a window where a visitor got the
    # new HTML and the old script - which looks exactly like a dashboard whose
    # panels are all empty, because that is what it is.
    #
    # "no-cache" is not "do not store": the copy is kept and a conditional
    # request revalidates it. nginx already answers those with a 304 and no
    # body off the ETag, so the cost is one small round trip per asset and the
    # benefit is that a deploy is live the moment it lands.
    "~*text/html"         "no-cache";
    "~*text/css"          "no-cache";
    "~*javascript"        "no-cache";
}

# The access log, without the address. The stock `main` format opens every line
# with $remote_addr, and with set_real_ip_from below that is the visitor's real
# address - so the default log was a list of who looked up which profile, and
# when, sitting in the container. Nothing on this site needs that: the rate
# limits read the address live and keep only a salted hash of it, and what a log
# is actually read for here is "did that request 500". So the address is simply
# not written. What stays is enough to debug a bad response and useless for
# following a person around.
#
# The rate limiting is unaffected - limit_req works off $binary_remote_addr at
# request time and never touches this.
log_format sp '$time_local "$request" $status $body_bytes_sent '
              '"$http_referer" "$http_user_agent" $request_time';

# What actually protects the Steam key is the cache in api.py; this limit only
# keeps one address from monopolising the service. Clicking through game pages
# costs three calls each, so the ceiling has to be well above a careful reader.
# ── Which dictionary this reader gets ────────────────────────────────────
# The site's strings are one file per language since they moved to
# SteamProfiler.i18n, each with English merged underneath, and a reader is sent
# exactly one of them at /dict.js. It used to be a single file with all
# languages in it: 152 KB gzipped for everybody, to read in one of them.
#
# The choice is a cookie because it is made in the browser - i18n.js writes
# `sp-lang` next to the localStorage entry it already kept - and a cookie is
# the only part of that decision this server can see.
#
# Accept-Language is the answer for a first visit, which has no cookie yet. It
# is the same guess pickLang() makes from navigator.languages, so the usual
# first visit gets the right file and never reloads. A mismatch is not a bug:
# i18n.js writes the cookie and reloads once, which is why this can afford to
# be a guess.
#
# serve.py in the front repo does the same three steps in the same order. If
# these two ever disagree, a string looks translated in a local checkout and
# arrives in English in production.
# Read off $http_cookie with a regex rather than with $cookie_sp_lang, which
# looks for a cookie named `sp_lang`: nginx turns dashes into underscores for
# header variables and does no such thing for cookie ones, so $cookie_sp_lang
# is empty forever and the guess below silently decides everything. The symptom
# is a reader who picks Russian, gets Portuguese, picks again, and gets
# Portuguese again.
map $http_cookie $sp_dict_chosen {
    default                              "";
    "~*(?:^|;\s*)sp-lang=en(?:\s*;|\s*$)"  "/dict.en.js";
    "~*(?:^|;\s*)sp-lang=pt(?:\s*;|\s*$)"  "/dict.pt.js";
    "~*(?:^|;\s*)sp-lang=ru(?:\s*;|\s*$)"  "/dict.ru.js";
    "~*(?:^|;\s*)sp-lang=zh-cn(?:\s*;|\s*$)"  "/dict.zh-cn.js";
    "~*(?:^|;\s*)sp-lang=zh-tw(?:\s*;|\s*$)"  "/dict.zh-tw.js";
}

map $http_accept_language $sp_dict_guess {
    default        "/dict.en.js";
    "~*^\s*pt"     "/dict.pt.js";
    "~*^\s*ru"     "/dict.ru.js";
    "~*^\s*zh-(?:tw|hk|mo|hant)"  "/dict.zh-tw.js";
    "~*^\s*zh"     "/dict.zh-cn.js";
}

map $sp_dict_chosen $sp_dict {
    default    $sp_dict_chosen;
    ""         $sp_dict_guess;
}

# ── Which prerendered page ───────────────────────────────────────────
# The rebuilt front in next/ ships one HTML file per page per language, with
# the text already in it, and the address never changes: a reader asks for
# /about and this decides whether that is about/index.pt.html or
# about/index.ru.html. It is the arrangement /dict.js has had since the
# dictionary was split, against the same cookie, for the same reason - a
# reader who chose a language should get it in the markup rather than after
# the script runs, and a crawler that runs no script should get a language at
# all.
#
# Two maps and a join rather than one, so a cookie beats Accept-Language and
# both beat nothing, in that order. The same order tools/check-dict-routing.sh
# has been asserting for /dict.js since the day that was got wrong.
map $http_cookie $sp_page_chosen {
    default                                   "";
    "~*(?:^|;\s*)sp-lang=en(?:\s*;|\s*$)"     "en";
    "~*(?:^|;\s*)sp-lang=pt(?:\s*;|\s*$)"     "pt";
    "~*(?:^|;\s*)sp-lang=ru(?:\s*;|\s*$)"     "ru";
    "~*(?:^|;\s*)sp-lang=zh-cn(?:\s*;|\s*$)"  "zh-cn";
    "~*(?:^|;\s*)sp-lang=zh-tw(?:\s*;|\s*$)"  "zh-tw";
}

map $http_accept_language $sp_page_guess {
    default                       "en";
    "~*^\s*pt"                    "pt";
    "~*^\s*ru"                    "ru";
    "~*^\s*zh-(?:tw|hk|mo|hant)"  "zh-tw";
    "~*^\s*zh"                    "zh-cn";
}

# The content policy, written once because four locations now send it and
# add_header does not inherit: a location that declares any header of its own
# drops every header the server declared. Four copies of a string this long
# is four chances for three of them to be right.
#
# A map with one answer is nginx's way of spelling a constant. $host is read
# only because a map has to key on something.
map $host $sp_csp {
    default "default-src 'self'; img-src 'self' data: https://avatars.steamstatic.com https://cdn.cloudflare.steamstatic.com https://cdn.akamai.steamstatic.com https://shared.akamai.steamstatic.com https://shared.fastly.steamstatic.com https://community.fastly.steamstatic.com https://community.cloudflare.steamstatic.com https://images.steamusercontent.com https://clan.cloudflare.steamstatic.com https://clan.steamstatic.com https://steamcdn-a.akamaihd.net https://media.steampowered.com; media-src blob: https://cdn.cloudflare.steamstatic.com https://video.akamai.steamstatic.com; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self' https://video.akamai.steamstatic.com; base-uri 'none'; frame-ancestors 'self'";
}

map $sp_page_chosen $sp_page {
    default    $sp_page_chosen;
    ""         $sp_page_guess;
}

limit_req_zone $binary_remote_addr zone=sp_api:10m rate=120r/m;
# Writes are a different shape of traffic: a person leaves one message, not ten.
# The database has its own per-address ceiling; this is the cheap outer gate.
limit_req_zone $binary_remote_addr zone=sp_write:10m rate=10r/m;
# The rarity scan is three calls to Steam per game against the owner's key, and
# it holds the one build lock the whole time. Nobody needs it twice a minute.
limit_req_zone $binary_remote_addr zone=sp_heavy:10m rate=6r/m;
# The trap, which is the one place a request from an address already banned is
# still allowed to reach the api. Low, because nothing legitimate lands here and
# the only reason to let any of it through is to write down what was tried.
limit_req_zone $binary_remote_addr zone=sp_trap:10m rate=60r/m;
# Slots, not requests. A hundred connections held open on slow reads is a shape
# a rate limit does not see, and every one of them is a thread upstream.
#
# Which requests are worth a slot, though, is the whole question, and counting
# all of them was wrong. A profile page opens twenty-eight subresources at once,
# and behind some reverse proxies each arrives on its own HTTP/1.1 connection -
# so a plain reload put more than twenty connections in flight from one address
# and the ceiling of sixteen refused five of its own scripts. The browser then
# reported the refusal as the abuse page arriving where a script was expected:
# "MIME type ('text/html') is not executable".
#
# An empty key is not counted, which is what everything served off disk gets:
# a static file and a mirrored key art leave in milliseconds, and a slot held
# for milliseconds measures nothing. What the slots exist for is the proxied
# side, where proxy_read_timeout is measured in tens of seconds and a held
# connection really is a thread waiting in api.py.
map $uri $sp_conn_key {
    default              "";
    "~^/api/"            $binary_remote_addr;
    "~^/appeal/send$"    $binary_remote_addr;
}
limit_conn_zone $sp_conn_key zone=sp_conn:10m;

upstream sp_api {
    server api:8000;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Overrides the image's default, which is `main` and starts with the address.
    access_log /var/log/nginx/access.log sp;

    # Do not trust forwarded address headers by default. A deployment behind a
    # reverse proxy should add exact `set_real_ip_from` entries for that proxy
    # and choose its real-IP header in an operator-owned nginx override.

    # Sixteen at once from one address, and now that the map above counts only
    # the proxied routes this is what it always meant to be: sixteen calls to
    # the api in flight, not sixteen files. A dashboard opens its panels
    # together and that is under ten.
    limit_conn sp_conn 16;
    limit_conn_status 429;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    add_header Cache-Control $sp_cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Achievement icons, catalogue screenshots and news art come straight
    # from Steam's CDNs now:
    # mirroring them worked for one fixed profile, but an arbitrary lookup would
    # have to fetch a thousand images before it could draw anything.
    # media-src is here for one thing and it is worth naming: a profile
    # background bought on Steam is a video, and the still that comes with it
    # is only half of what the profile wears. One host, the same one the
    # avatars already come from, and no other kind of source gains anything -
    # default-src stays 'self', so this widens playback and nothing else.
    add_header Content-Security-Policy $sp_csp always;

    # ── The shut door ────────────────────────────────────────────────
    # Every request asks bans.py whether this address is shut out before nginx
    # serves a byte of it - pages, scripts, fonts and key art alike.
    #
    # This is the strictest of the three places it could have gone, and the
    # cost is worth writing down rather than discovering: the api container is
    # now in the path of every static file. If it stops answering, this
    # subrequest fails and the whole site returns 500, where before a dead api
    # only broke /api/ and the pages still rendered. What stands between this
    # line and that outage is the healthcheck in docker-compose.yml and
    # `restart: unless-stopped`. If that trade ever stops being worth it, the
    # fix is one line: move `auth_request` off the server block and onto the
    # document locations only.
    auth_request /_gate;

    # The gate's three answers, turned back into something a person can read.
    #
    # 403 is bans.py: this address asked for /.env, and it has two days to
    # think about it. The status stays 403, which is what it is.
    #
    # 401 is guard.py's thirty-second shut-out, and 401 only because
    # auth_request accepts exactly two refusals, 401 and 403, and treats every
    # other code as a broken auth service worth a 500. `=429` puts the honest
    # status back on the way out: nobody is being asked to authenticate, they
    # are being asked to slow down.
    #
    # 429 on its own is what limit_req and limit_conn raise, and it lands on
    # the same page.
    error_page 403      /banned.html;
    error_page 401 =429 /abuse.html;
    error_page 429      /abuse.html;

    # The gate itself. `internal` means nobody can request it from outside;
    # auth_request off, or checking whether you are banned would check whether
    # you are banned. No body is forwarded: this route is a hash lookup and the
    # payload of a POST is none of its business.
    location = /_gate {
        internal;
        auth_request off;
        proxy_pass http://sp_api/gate;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
        # The gate is the only place that sees every request the site serves,
        # so it is also where census.py counts them. These four are what it
        # needs and the whole of what it needs.
        #
        # $uri and not $request_uri: the query string is not wanted here. It
        # would carry the profile somebody searched for into the one code path
        # that knows the visitor's address, which is the pairing this whole
        # design exists to keep apart. The path alone tells the census what it
        # asks - was this a page, an asset, a font, a scan - and nothing else.
        proxy_set_header X-Sp-Path $uri;
        proxy_set_header X-Sp-UA $http_user_agent;
        # Already resolved, by Cloudflare, on the way in. This server never
        # geolocates anything and never needs to: it receives two letters and a
        # region name. Empty until the zone has IP Geolocation on and the
        # "Add visitor location headers" managed transform enabled - the census
        # simply records no origin until then, rather than guessing one.
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
        proxy_set_header CF-Region $http_cf_region;
        # Short on purpose. This runs on every request, so a gate that hangs
        # is a site that hangs, and failing fast is the lesser harm.
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
        access_log off;
    }

    # The two pages. Static files, no script, no webfont, no favicon lookup:
    # everything a banned scanner or a throttled reader needs is in the one
    # response, which is the point. They carry their own CSP because the site's
    # `style-src 'self'` forbids the inline <style> they are built from - and
    # the policy below is tighter than the site's, not looser, since these
    # pages load nothing at all.
    #
    # `internal` is doing real work here, twice over. It keeps the two pages
    # from being fetched directly, so neither is a URL anyone can link to; and
    # `auth_request off` is what stops the recursion, because an error_page
    # that points at a URI restarts location matching, and a ban page that has
    # to pass the gate to be served would be refused by the very ban it exists
    # to explain. nginx would give up after ten rounds and return 500.
    location = /banned.html {
        internal;
        auth_request off;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;
    }

    location = /abuse.html {
        internal;
        auth_request off;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;
        # A throttled reader is coming back in half a minute. Telling them
        # when is the difference between a wall and a wait. Must track
        # GUARD_BLOCK in guard.py: nginx cannot read that value, so the two are
        # kept in step by hand and a mismatch is a page that lies.
        add_header Retry-After 30 always;
    }

    # ── The API ──────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=sp_api burst=60 nodelay;
        limit_req_status 429;

        # The site's own fetch() calls land here, and dash.js renders whatever
        # `error` holds. An HTML page in that slot is a parse failure and an
        # empty panel, so these two keep answering in JSON while every other
        # route gets the pages above.
        error_page 403 = @banned_json;
        error_page 401 = @too_many;
        error_page 429 = @too_many;

        proxy_pass http://sp_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The service hashes this and never stores it; it needs the real address
        # to count one vote per person and to throttle a flood.
        proxy_set_header X-Real-IP $remote_addr;
        # A cold profile lookup is a handful of round trips to Steam.
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
    }

    # The rarity scan. Its own zone because it is the one route that is
    # expensive on purpose: an exact-match location, so it wins over the
    # regex and the prefix above it.
    location = /api/rarities {
        limit_req zone=sp_heavy burst=2 nodelay;
        limit_req_status 429;
        error_page 403 = @banned_json;
        error_page 401 = @too_many;
        error_page 429 = @too_many;

        proxy_pass http://sp_api/rarities$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Twelve games, three calls each. Longer than any other route here.
        proxy_read_timeout 90s;
    }

    # Leaving a message and voting: tighter limit, same backend. A vote on a
    # blog post is the same shape of write as a vote on the board - one row,
    # one address, no Steam call - so it belongs in the same zone rather than
    # in the general one, where it would be priced like a lookup.
    location ~ ^/api/(feedback|vote|blog/vote)$ {
        limit_req zone=sp_write burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        error_page 403 = @banned_json;
        error_page 401 = @too_many;
        error_page 429 = @too_many;

        # The capture strips /api/, the same way the trailing slash does above.
        proxy_pass http://sp_api/$1;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── The owner's door is not in this building ─────────────────────
    # The admin surface lives in its own optional container and is never routed
    # through this public listener.
    #
    # These two blocks must stay. `location /api/` is a prefix match that
    # forwards everything under it to the api container, and it is only beaten
    # here by a longer prefix. Deleting them would not close the door: it would
    # drop /api/admin/ straight into the generic rule, with no filter at all.
    # The api container still serves /admin/ on the Compose network, which is
    # how the admin container reaches it.
    location /api/admin/ { return 404; }
    location = /admin    { return 404; }

    # The gate and the trap answer nginx, not the internet. `location /api/`
    # would otherwise expose both: /api/gate as a way to probe whether an
    # address is banned, and /api/trap as a way to ban yourself on purpose.
    # Neither is dangerous; neither has any business being reachable.
    location = /api/gate { return 404; }
    location = /api/trap { return 404; }

    # A throttled visitor should still read a sentence, not an nginx error page.
    # This is the JSON half, for the site's own fetch() calls. The 429 that a
    # *page* request gets is /abuse.html, wired up at the top of this block,
    # and there is deliberately no `error_page 429 = @too_many;` out here at
    # server level any more: it sat below that line and quietly won.
    location @too_many {
        default_type application/json;
        return 429 '{"error":"@err.blocked"}';
    }

    # The ban, in the shape the front end can read. Same status the page gets.
    location @banned_json {
        default_type application/json;
        return 403 '{"error":"@err.banned"}';
    }

    # ── Public game routes ───────────────────────────────────────────
    # game-public.html carries this SSI directive in its head:
    #   <!--#include virtual="/api/game/public/meta?appid=$appid" -->
    location ~ "^/g/(?<appid>\d{1,8})$" {
        try_files /game-public.html =404;
        ssi on;
    }

    location /g/ {
        try_files $uri /game-public.html;
    }

    # ── Profile routes ───────────────────────────────────────────────
    # /u/<perfil> and /u/<perfil>/<appid> are the same shell; the path is the
    # state and router.js reads it.
    # The profile name is the first path segment, and it is the only thing the
    # preview needs - /api/og.png resolves it exactly as the page does. This is
    # what lets one static shell carry a different preview per profile without
    # rendering any HTML on the server.
    #
    # The character class is not decoration. $who lands inside an HTML attribute
    # with no escaping, so anything that could carry a quote out of it has to be
    # unable to match in the first place. Vanity names and steamID64s live well
    # inside this set; anything stranger falls through to the plain location
    # below and simply gets the generic preview.
    # One game, which is the only /u/ path whose look is decided before any
    # data arrives. The shell is the same file the other views get; what this
    # location adds is one SSI include that asks the api which theme this appid
    # is, and pastes the answer into the head as a meta tag.
    #
    # It is here and not in the client because of when it has to be true. The
    # wait screen is drawn before the first answer lands, so a theme fetched by
    # the page would arrive after it: every themed game would open grey and
    # become itself a moment later. Arriving in the shell, it never was grey.
    #
    # Above the general /u/ regex, because nginx tries these in file order and
    # that one matches this path too. The appid pattern is the same one the api
    # checks, for the usual reason: a path this accepts and that one refuses is
    # a page that opens onto an error inside its own head.
    location ~ "^/u/(?<who>[A-Za-z0-9_.-]+)/(?<appid>\d{1,8})$" {
        try_files /profile.html =404;
        ssi on;
        sub_filter '<!--og-->'
            '<meta property="og:title" content="$who on steamprofiler.org"><meta property="og:url" content="$ext_scheme://$host$request_uri"><meta property="og:image" content="$ext_scheme://$host/api/og.png?q=$who"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image">';
        sub_filter_once on;
    }

    location ~ ^/u/(?<who>[A-Za-z0-9_.-]+) {
        # Serving the shell straight from here rather than falling through to
        # it: try_files' last argument is a URI, and following it would restart
        # location matching in `location /`, where sub_filter does not exist.
        try_files /profile.html =404;
        sub_filter '<!--og-->'
            '<meta property="og:title" content="$who on steamprofiler.org"><meta property="og:url" content="$ext_scheme://$host$request_uri"><meta property="og:image" content="$ext_scheme://$host/api/og.png?q=$who"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image">';
        sub_filter_once on;
    }

    location /u/ {
        try_files $uri /profile.html;
    }

    # ── The trap ─────────────────────────────────────────────────────
    # Asking for any of these is not a mistake anybody makes. Thirteen hours of
    # this server's log held about three hundred distinct paths of it, and they
    # all collapse into the alternation below:
    #
    #   \.env                 /.env and the hundred and eighty directories it
    #                         was tried under, plus .bak .old .prod .save ~ 1 2
    #   \.php                 the site serves no PHP at all, so every one of
    #                         phpinfo.php, xmlrpc.php, p.php, i.php is a tell
    #   ^/\.                  root dotfiles: /.git/config, /.aws/credentials,
    #                         /.netrc, /.pypirc, /.docker/config.json
    #   wp-(includes|admin)   wlwmanifest.xml and friends
    #   the literal list      /secrets.json, /config.json, /_environment, /env
    #
    # Three deliberate exclusions, each one a path a real visitor produced in
    # that same log. /.well-known/ is ACME and certificate renewal. robots.txt,
    # sitemap.xml and favicon.png are ordinary crawler and browser behaviour.
    # /busca.js is this site's own file under its old name, still being asked
    # for by anyone holding a cached page from before the rename - banning that
    # would ban a reader.
    #
    # Placed after the /u/ block on purpose. Both are regexes, nginx tries them
    # in file order, and a vanity name is allowed to contain a dot: putting this
    # first would shut out a visitor for looking up a profile called x.php.
    #
    # auth_request is OFF here, and that is a reversal worth explaining. It was
    # on, so that an address already banned got the page from the gate and never
    # reached the proxy - one database write per sweep instead of three hundred.
    # The cost of that only showed up in the panel: every ban recorded exactly
    # one path, always the first, and "/.env" on its own tells the owner nothing
    # about whether they are looking at a stray dependency scanner or somebody
    # working through a list. So the trap now sees every attempt, bans.py drops
    # the repeats before they reach SQLite and stops writing after sixty
    # distinct paths, and the zone below caps the rate at the door.
    location ~ "(?:\.env|\.php|phpinfo|^/\.(?!well-known)|/wp-(?:includes|admin|content|login)|^/(?:secrets\.json|config\.(?:json|js|ya?ml)(?:\.\w+)?|aws[-.](?:config\.js|ses\.json)|_environment|env)$|/js/config\.js$)" {
        auth_request off;
        limit_req zone=sp_trap burst=20 nodelay;
        limit_req_status 429;
        # Through a variable, and not because the value ever changes: nginx
        # refuses a literal URI on proxy_pass inside a regex location, and a
        # variable is the way past that. The same trick as `proxy_pass
        # http://sp_api/$1` in the feedback block above.
        set $trap_route /trap;
        proxy_pass http://sp_api$trap_route;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Nothing this request carries is wanted. Not the body of a POST to
        # wp-login.php, not its method: the offence is the path, and the path
        # arrives in a header of its own so bans.py can record what was tried.
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Trap-Path $request_uri;
        # api.py answers 403 and this turns that into the page. Without it the
        # bare upstream 403 would go back with no body at all.
        proxy_intercept_errors on;
        error_page 403 /banned.html;
        # If the api is down the ban cannot be recorded, and the honest answer
        # is the same 404 this path had before any of this existed.
        error_page 502 504 = @trap_down;
    }

    location @trap_down { return 404; }

    # The pre-generated pages from when the site only knew one profile.
    # ── Key art ──────────────────────────────────────────────────────
    # Served off disk from the directory api.py writes into. The file is only
    # missing the first time a game's page is opened; after that this never
    # touches Python. Nothing is pre-fetched, so the directory only ever holds
    # the games somebody actually looked at.
    # Quoted: nginx reads an unquoted { } in a regex as a config block.
    location ~ "^/art/(?<appid>\d{1,8})\.jpg$" {
        # Not under the html root: ./site is mounted read-only and a mountpoint
        # cannot be created inside it, so the cache lives at /srv/art.
        root /srv;
        try_files /art/$appid.jpg @art_fetch;
        access_log off;
    }

    location @art_fetch {
        limit_req zone=sp_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://sp_api/art?appid=$appid;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        # A cold fetch is one trip to Steam's CDN, not a profile build.
        proxy_read_timeout 30s;
    }

    location /jogo/ {
        # Absoluto, com $ext_scheme. Um `return 301` com destino relativo é
        # expandido pelo nginx usando $scheme, que atrás do túnel é sempre
        # "http" por mais que o visitante tenha pedido https - o mesmo motivo
        # que fez o $ext_scheme existir lá em cima. O resultado era um link
        # antigo levando o visitante para http e deixando ele lá.
        return 301 $ext_scheme://$host/;
    }

    # Clean URLs for the pages that are not profile lookups. Every path the site
    # serves is English, so a reader in any of the three languages sees a URL
    # they can read; the page's own copy is what gets translated.
    # ── The appeal ───────────────────────────────────────────────────
    # The one door left open to a banned address, and the only three locations
    # on this server that turn the gate off. That is not an oversight to be
    # tidied up later: a page whose entire purpose is to contest a ban cannot
    # itself be refused by that ban, and neither can the form it posts to.
    #
    # What holds this up instead of the gate is the sp_write zone, the
    # per-address hourly ceiling in store.add(), and the honeypot field in the
    # form. A scanner does not fill in forms; a person contesting a false
    # positive does it once.
    location = /appeal {
        auth_request off;
        try_files /appeal.html =404;
        # form-action is the one thing this policy has that the other two do
        # not, because this is the one page that posts anywhere.
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;
    }

    location = /appeal/sent {
        auth_request off;
        try_files /appeal-sent.html =404;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;
    }

    location = /appeal/send {
        auth_request off;
        limit_req zone=sp_write burst=2 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;

        proxy_pass http://sp_api/appeal;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # One file per language, chosen above. The headers are repeated rather than
    # inherited because add_header does not inherit once a level declares one of
    # its own: without these three lines this file would be the only asset on
    # the site with no Cache-Control and no nosniff.
    #
    # Vary is what keeps a shared cache from handing a Russian dictionary to the
    # next reader. The Cache-Control for javascript is already "no-cache", so
    # this revalidates on every load anyway and the fragmentation costs nothing.
    location = /dict.js {
        add_header Cache-Control $sp_cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Vary "Cookie, Accept-Language" always;
        try_files $sp_dict =404;
    }

    location = /feedback { try_files /feedback.html =404; }
    location = /support  { try_files /support.html =404; }
    location = /extension { try_files /extension.html =404; }
    location = /translate { try_files /translate.html =404; }

    # ── The front that is being rebuilt ──────────────────────────────
    # Two static trees are served from this file. `site/` is the one that has
    # always been here and still answers almost everything; `next/` is the
    # rebuild, and it answers exactly the five addresses below. Which tree a
    # path comes from is decided here and nowhere else, so moving a page from
    # one to the other is a line in this file and nothing more.
    #
    # The fallback is the point of the arrangement. If `next/` is not mounted,
    # or a deploy put the api up before the front, or the prerender wrote
    # nothing, try_files falls through to @front_old and the old page is
    # served exactly as it was yesterday. A bad build is a page that does not
    # change rather than a site that goes down.
    #
    # The header block is repeated because add_header does not inherit once a
    # level declares one of its own, the same trap /dict.js documents above.
    # Vary is what stops a shared cache handing a Portuguese page to the next
    # reader, and it is the only line here that is new rather than copied.
    location = / {
        root /usr/share/nginx/next;
        set $sp_old /index.html;
        add_header Cache-Control $sp_cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy $sp_csp always;
        add_header Vary "Cookie, Accept-Language" always;
        try_files /index.$sp_page.html /index.en.html @front_old;
    }

    # Named capture, not $1, and this is not style: evaluating $sp_page runs
    # the regex inside those maps, and a map's own regex resets $1 before
    # try_files is built. The path came out as //index.en.html and the whole
    # thing 404'd. Every other regex location in this file uses a named
    # capture for the same reason.
    location ~ ^/(?<sp_page_name>news|privacy|about|status)$ {
        root /usr/share/nginx/next;
        set $sp_old /$sp_page_name.html;
        add_header Cache-Control $sp_cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy $sp_csp always;
        add_header Vary "Cookie, Accept-Language" always;
        try_files /$sp_page_name/index.$sp_page.html /$sp_page_name/index.en.html @front_old;
    }

    # ── Steam's own news, borrowed ───────────────────────────────────
    # The news pages read two endpoints that belong to Valve: the hub's feed,
    # which carries the whole body of every post, and the events endpoint,
    # which carries the artwork behind it. Neither sends a CORS header, so a
    # browser cannot ask them directly and something has to ask on its behalf.
    #
    # It is here and not in the api because there is nothing to add: no key,
    # no shaping, no cache of ours. The api's own /companion already fetches
    # the five most recent posts through fetch.py, and a route there is the
    # better home for this the day it needs a cache or a budget of its own.
    #
    # These two were the last thing standing between the rebuilt front and
    # production: vite.config.ts proxies them in development and serve-dist.mjs
    # proxies them for the preview, and neither of those is nginx. The news
    # panel said "Steam did not answer" on the live site for exactly as long
    # as this block did not exist.
    # A variable in proxy_pass moves the lookup from config load to request
    # time, and at request time nginx needs to be told who resolves names.
    # 127.0.0.11 is Docker's own DNS, which is what every other name in this
    # file already resolves through. Without this line both routes answer 502
    # and the log says "no resolver defined", which is exactly what they did.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location = /steamnews {
        proxy_pass https://api.steampowered.com/ISteamNews/GetNewsForApp/v2/$is_args$args;
        proxy_set_header Host api.steampowered.com;
        proxy_set_header Accept application/json;
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /steamevents {
        proxy_pass https://store.steampowered.com/events/ajaxgetpartnereventspageable/$is_args$args;
        proxy_set_header Host store.steampowered.com;
        proxy_set_header Accept application/json;
        proxy_ssl_server_name on;
        proxy_hide_header Set-Cookie;
        add_header Cache-Control "public, max-age=900" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # One post of the Steam news hub. The id is in the path and the script
    # reads it off location.pathname, the same arrangement /blog and /u/ use,
    # so every one of them is the same file.
    location ^~ /news/ {
        root /usr/share/nginx/next;
        set $sp_old /404.html;
        add_header Cache-Control $sp_cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy $sp_csp always;
        add_header Vary "Cookie, Accept-Language" always;
        try_files /news/index.$sp_page.html /news/index.en.html @front_old;
    }

    # The bundle and the stylesheet. Their names carry a content hash, so they
    # are the one thing on this site that can be cached hard and forever.
    location ^~ /assets/ {
        root /usr/share/nginx/next;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Where a missing next/ lands: the page site/ was serving before any of
    # this existed. $sp_old is set by whichever location sent us here.
    location @front_old {
        root /usr/share/nginx/html;
        try_files $sp_old =404;
    }

    # ── The franchise screens ────────────────────────────────────────
    # One shell for the index and for each of the ten, the same arrangement
    # /blog and /u/ use: the path is the state and fxpage.js reads it off
    # location.pathname. The exact match wins over the regex under it, so the
    # index does not need to be a special case inside that pattern.
    #
    # No SSI and no sub_filter here, unlike /g/ and /u/: this page's head is
    # the same for all eleven addresses because a franchise's name and picture
    # are in the shell's own script, not in an answer from the api. A slug the
    # script does not know redirects to the index rather than 404ing, which is
    # why the pattern only has to be the shape of a slug and not the list.
    location = /franchises { try_files /franchises.html =404; }
    location ~ "^/franchises/[a-z0-9][a-z0-9-]{0,39}$" {
        try_files /franchises.html =404;
    }

    # ── The house screens ────────────────────────────────────────────
    # Two axes, one shell each, and the same arrangement the franchises use:
    # the path is the state and housepage.js reads it off location.pathname.
    #
    # Publisher and developer are two addresses rather than one with a query,
    # because they are two different shelves - Valve published Garry's Mod and
    # did not make it - and a shelf that can be linked to is worth a path.
    location = /publishers { try_files /publishers.html =404; }
    location = /developers { try_files /developers.html =404; }
    location ~ "^/publishers/[a-z0-9][a-z0-9-]{0,39}$" {
        try_files /publishers.html =404;
    }
    location ~ "^/developers/[a-z0-9][a-z0-9-]{0,39}$" {
        try_files /developers.html =404;
    }

    # ── The blog ─────────────────────────────────────────────────────
    # One shell for every post, the same arrangement /u/ uses: the path is the
    # state and post.js reads it off location.pathname. The exact-match index
    # wins over the regex below it, which is why /blog does not need to be an
    # id that happens to be spelled "blog".
    #
    # The character class is the same one blog.py checks an id and a slug
    # against, and the three have to stay in step: an address the database
    # accepts and this refuses is a post that exists and cannot be opened.
    # Quoted, because nginx reads an unquoted {0,79} in a regex as a config
    # block and will not start.
    location = /blog { try_files /blog.html =404; }

    # The preview of a post, which is the one thing the shell cannot carry.
    # /u/ gets away with sub_filter because a profile's preview is built out of
    # the path itself; a post's is built out of its title, and nginx has no way
    # to know that. So the shell is served with an SSI include in its head and
    # the api answers it with the tags, before the page leaves this container.
    # Everything that draws a link card - Discord, Telegram, a search engine
    # doing a first pass - reads that head without running any JavaScript, and
    # without this it would read "steamprofiler.org" and nothing else.
    #
    # A post's address is two segments now: `/blog/<id>/<title>`, where the id
    # is what resolves the post and the title is one of its own titles written
    # as a URL. The tail is optional - `/blog/<id>` on its own is a working
    # address, and it is the only one a post has in a language whose title has
    # no slug yet - so the second capture is often empty.
    #
    # Both travel into the include, and they are two different questions. The
    # id says which post; the title says which language, because it is the
    # title of exactly one of them. That second half only matters to whatever
    # is reading this page without running any JavaScript - a link card, a
    # crawler - since a browser gets the reader's own language and rewrites the
    # address to match. Sending only the id would give every one of the three
    # addresses the same preview, in the language the post was written in.
    #
    # Named captures rather than $1 and $2 because they travel into the
    # include, and both are already known to match the character class blog.py
    # accepts. The api answers an unknown one with an empty body, so a typed
    # URL costs a subrequest and produces no preview, which is right.
    #
    # The host and the scheme go along with it. They used to be pasted in here
    # by the sub_filter below, which could do it because there was one address
    # per post; now there are three and only the api knows which is which, so
    # it writes the canonical link and the alternates itself and needs to be
    # told where the site answers. $http_host and not $host because the latter
    # drops a non-default port.
    location ~ "^/blog/(?<key>[a-z0-9][a-z0-9-]{0,79})(?:/(?<title>[a-z0-9][a-z0-9-]{0,79}))?$" {
        try_files /post.html =404;
        ssi on;
    }
    # Every version the policy has ever had. A path under /privacy rather than
    # beside it, because it is the same document seen from further back.
    location = /privacy/history { try_files /policy-history.html =404; }

    # The sitemap is built by the api, because half of it is the blog and the
    # blog is a table. robots.txt is next to it in site/ and is a plain file:
    # it never changes, and a crawler that cannot read it crawls everything.
    #
    # Served here at the root and not under /api/, which is where a crawler
    # would never look for it. The scheme has to be handed over explicitly -
    # the api sees a plain HTTP request from this container no matter what the
    # visitor used, and a sitemap full of http:// addresses on an https:// site
    # is a sitemap of redirects.
    location = /sitemap.xml {
        proxy_pass http://sp_api/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # $http_host and not $host, which is the only route here that cares:
        # $host drops the port, and every address in a sitemap is absolute.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $ext_scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # The Portuguese paths the site was born with. Links to them are already out
    # there - in the message board, in whatever people bookmarked - so they get
    # a permanent redirect rather than a 404. 301 and not 302: the new path is
    # the real one and search engines should move their index over.
    # Absolutos, com $ext_scheme, pelo motivo explicado em /jogo/ acima.
    location = /apoiar   { return 301 $ext_scheme://$host/support; }
    location = /recados  { return 301 $ext_scheme://$host/feedback; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Both answer without touching disk or upstream, so sending a subrequest to
    # the api first would cost more than the answer. /healthz especially: it is
    # what docker restarts this container over, and routing the liveness probe
    # through the service it is meant to be independent of is how a healthy
    # container gets killed for somebody else's outage.
    location = /healthz {
        auth_request off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The icon set, and the reason it is a block of its own rather than four
    # files under `location /`.
    #
    # /favicon.ico answered 404 here, because for a long time there was no such
    # file: the site declared an SVG in every <head> and nothing else, and the
    # 404 was cheaper than a disk lookup that was going to fail anyway. What
    # that missed is who asks for /favicon.ico. It is not the browser, which
    # reads the <link> and never guesses. It is Google's favicon crawler, which
    # falls back to the well-known path, and a 404 there is the site saying it
    # has no icon - which is what the search result showed, a grey globe next
    # to a page that had a mark all along.
    #
    # auth_request stays off, as it was: an icon is fetched by things that
    # never see the gate, and putting a subrequest in front of five static
    # files costs more than the files.
    #
    # `expires` and not `add_header`, which is not a style choice. add_header
    # is inherited from the server level only while the current level declares
    # none of its own: one add_header here would silently drop the CSP, the
    # nosniff, the referrer policy and the frame options from every icon
    # response. `expires` writes Cache-Control without touching that
    # inheritance, so the icons keep every header the rest of the site sends.
    location ~ "^/(favicon\.ico|favicon\.svg|icon-192\.png|icon-512\.png|apple-touch-icon\.png)$" {
        auth_request off;
        access_log off;
        expires 1d;
        try_files $uri =404;
    }
}
